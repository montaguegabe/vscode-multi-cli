name: Auto Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine hatch hatch-vcs

      - name: Create next patch tag
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [[ -n "$existing_tag" ]]; then
            echo "HEAD is already tagged as $existing_tag; nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          while git rev-parse --verify --quiet "refs/tags/$next_tag" >/dev/null; do
            version="${next_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Created local tag $next_tag"

      - name: Build package
        if: steps.version.outputs.should_publish == 'true'
        run: hatch build

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Push release tag
        if: steps.version.outputs.should_publish == 'true'
        run: |
          git push origin "refs/tags/${{ steps.version.outputs.next_tag }}"
